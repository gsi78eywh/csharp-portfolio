services:
  - type: web
    name: seth-jabagat-portfolio
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/gsi78eywh/csharp-portfolio
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORTFOLIO_RELEASE
        value: "2026.09.14-profile-hover-update"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
